{%- comment -%} 周报 / 月报单期：往期栏（周报或月报）+ 报纸版面 {%- endcomment -%}
{%- assign reps = site.reports | where: "kind", page.kind | sort: "start" -%}
<div class="paper-shell">
  {% include paper-archive.html kind=page.kind cur=page.url %}
  <div class="paper-stage">
    {% include paper-report.html r=page %}
  </div>
</div>
<script type="application/json" id="paper-index">{"{{ page.kind }}":[{% for x in reps %}{"k":"{{ x.period }}","u":"{{ x.url | relative_url }}"}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
